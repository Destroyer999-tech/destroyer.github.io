<canvas id="matrix"></canvas>
<div class="scanlines"></div>

<!-- FIRST PAGE -->
<div class="terminal" id="question">

    <div class="status">SECURE CONNECTION</div>

        [ RETURN ]
    </button>

    </div>

</div>


<script>

/* =========================
   BUTTON LOGIC
========================= */

function trustPage() {

    document.getElementById("question").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("resultTitle").innerHTML =
        "HAHA.";

    document.getElementById("resultText").innerHTML =
        "Doesnt matter now,lolllllll";
}


function exitPage() {

    document.getElementById("question").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("resultTitle").innerHTML =
        "WELL...";

    document.getElementById("resultText").innerHTML =
        "well, i never thought u actually trusted me..<br>" +
        "thanks for confirmations.";
}


/* =========================
   MATRIX EFFECT
========================= */

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();

const chars =
    "01ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz#$%@&<>/";

const fontSize = 14;
let columns = Math.floor(canvas.width / fontSize);
let drops = Array(columns).fill(1);

function drawMatrix() {

    ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#00ff66";
    ctx.font = fontSize + "px Courier New";

    for (let i = 0; i < drops.length; i++) {

        const char =
            chars[Math.floor(Math.random() * chars.length)];

        ctx.fillText(
            char,
            i * fontSize,
            drops[i] * fontSize
        );

        if (
            drops[i] * fontSize > canvas.height &&
            Math.random() > 0.975
        ) {
            drops[i] = 0;
        }

        drops[i]++;
    }
}

setInterval(drawMatrix, 35);

window.addEventListener("resize", () => {
    resizeCanvas();
    columns = Math.floor(canvas.width / fontSize);
    drops = Array(columns).fill(1);
});

</script>

</body>
